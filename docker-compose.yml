# StallFront - minimal setup.
# Start with: docker compose up -d   then open http://localhost:8080
# Without DB_* settings the container uses its own MariaDB and generates
# every password and key on the first start. All data stays in ./data.
services:
  stallfront:
    image: ghcr.io/angelc112/stallfront:latest
    container_name: stallfront
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data:/data
    environment:
      APP_URL: "http://localhost:8080"     # public address, used in email links and images
      APP_TIMEZONE: "Europe/Rome"
      # APP_LOCALE: "en"                   # language when the browser one is not supported
      # APP_CURRENCY: "EUR"

      # Email (without these, emails are only written to the log)
      # MAIL_MAILER: "smtp"
      # MAIL_HOST: "smtp.example.com"
      # MAIL_PORT: "587"
      # MAIL_USERNAME: "shop@example.com"
      # MAIL_PASSWORD: "change-me"
      # MAIL_FROM_ADDRESS: "shop@example.com"

      # External database instead of the embedded one
      # DB_CONNECTION: "mysql"             # mysql | pgsql
      # DB_HOST: "192.0.2.10"
      # DB_PORT: "3306"
      # DB_DATABASE: "stallfront"
      # DB_USERNAME: "stallfront"
      # DB_PASSWORD: "change-me"
