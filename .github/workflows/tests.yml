# Runs the test suite on every push and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_sqlite, bcmath, exif
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund && npm run build
      - name: Run the tests
        run: |
          set -o pipefail
          vendor/bin/phpunit --display-warnings --display-deprecations 2>&1 | tee phpunit.log
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Warnings do not fail the run and are easy to miss in the log:
      # the first ones are repeated as annotations on the run page.
      - name: Show the first warnings as annotations
        if: always()
        run: |
          [ -f phpunit.log ] || exit 0
          grep -E -A1 '^[0-9]+\) /' phpunit.log | grep -v '^--$' | paste -d' ' - - | sort -u | head -n 8 \
            | while IFS= read -r line; do echo "::warning::${line}"; done
